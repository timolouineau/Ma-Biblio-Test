name: Icônes depuis le logo actuel
on:
  push:
    paths: ['.github/workflows/logo.yml']
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger le logo et fabriquer les icônes
        continue-on-error: true
        run: |
          pip install --quiet pillow
          mkdir -p icons
          python3 - <<'PY' > icons/build-log.txt 2>&1
          import urllib.request, io
          from PIL import Image
          url = "https://i.postimg.cc/mZFY1S2M/Design-sans-titre.png"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Safari/604.1"})
          data = urllib.request.urlopen(req, timeout=30).read()
          print("octets:", len(data))
          img = Image.open(io.BytesIO(data)).convert("RGBA")
          print("taille:", img.size)
          open("icons/logo-original.png", "wb").write(data)
          w, h = img.size
          bg = img.getpixel((3, 3))
          side = max(w, h)
          sq = Image.new("RGBA", (side, side), bg)
          sq.paste(img, ((side - w) // 2, (side - h) // 2), img)
          flat = Image.new("RGB", sq.size, bg[:3]); flat.paste(sq, (0, 0), sq)
          for n, name in [(512, "icon-512.png"), (192, "icon-192.png"), (180, "apple-touch-icon.png"), (64, "favicon-64.png")]:
              flat.resize((n, n), Image.LANCZOS).save("icons/" + name)
          m = Image.new("RGB", (512, 512), bg[:3]); m.paste(flat.resize((410, 410), Image.LANCZOS), (51, 51))
          m.save("icons/icon-maskable-512.png")
          print("fond:", bg, "OK")
          PY
          cat icons/build-log.txt
      - name: Enregistrer
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -q .github/workflows/logo.yml
          git add icons
          git commit -m "Icônes de l'appli fabriquées à partir du logo actuel"
          git push
